name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'spanish/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # allow manual trigger from Actions tab

jobs:
  deploy-frontend:
    name: Deploy frontend (spanish/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 65ad85bd66fe9d0f0ca1e270da90e088
          command: pages deploy spanish --project-name=maestra-lupita --branch=main --commit-dirty=true
