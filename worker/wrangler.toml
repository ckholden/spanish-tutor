name = "maestra-lupita-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "maestra-lupita"
CLOUDFLARE_PAGES_ORIGIN = "https://holdenportal.com,https://maestra-lupita.pages.dev"

# Secrets — set via: wrangler secret put <NAME>
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY
# - FIREBASE_WEB_API_KEY  (technically public-safe per Firebase docs, but moved to
#   Worker secrets to silence GitHub secret-scanning false positives)

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2673072fd10f47549bc68a3704987f5d"
preview_id = "fc6da9068bf84467a7610012681fba12"

# Routes — uncomment once custom domain is set up
# [[routes]]
# pattern = "holdenportal.com/spanish/api/*"
# zone_name = "holdenportal.com"
